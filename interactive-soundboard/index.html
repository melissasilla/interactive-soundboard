<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="style.css" />

    <title>Interactive Soundboard</title>
  </head>
  <body>
    <!-- audio files -->
    <audio id="sound-1" src="audio-sounds/kick_sweet.wav"></audio>
    <audio id="sound-2" src="audio-sounds/BABY LIVE SNARE.wav"></audio>
    <audio id="sound-3" src="audio-sounds/HI_HAT.wav"></audio>
    <audio
      id="sound-4"
      src="audio-sounds/37 Bubbling And Rising Synth Tone. Reverby And Complex In Texture .wav"
    ></audio>

    <div class="button-container">
      <button class="sound-button" data-sound="sound-1">Kick</button>
      <button class="sound-button" data-sound="sound-2">Snare</button>
      <button class="sound-button" data-sound="sound-3">Hi-Hat</button>
      <button class="sound-button" data-sound="sound-4">Synth</button>
    </div>

    <!-- glitch screen container -->
    <div id="glitch-background">
      <!-- sound triggers -->

      <!-- generated text noise will go here -->
      <span id="glitch-text"></span>
    </div>

    <script src="app.js"></script>
  </body>
</html>
